[package]
name = "axi-dmac"
version = "0.1.0"
description = "ADI AXI DMAC IP core driver"
rust-version = "1.88.0"
edition = "2024"
homepage = "https://github.com/us-irs/axi-hdl-rs"
repository = "https://github.com/us-irs/axi-hdl-rs"
license = "MIT OR Apache-2.0"

[dependencies]
derive-mmio = "0.8"
bitbybit = "2"
arbitrary-int = "2"
static_assertions = "1.1"
thiserror = { version = "2", default-features = false }

defmt = { version = "1", optional = true }
